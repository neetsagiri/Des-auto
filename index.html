<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOV Loading Edit Studio - Dimension Breaker Style</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #06020c;
      color: #f3e8ff;
      padding: 16px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 20px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff, #c084fc, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 900;
    }
    .panel {
      width: 100%;
      max-width: 500px;
      background: rgba(22, 10, 36, 0.9);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.85);
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .btn-up {
      background: #190a2a;
      border: 1.5px dashed #a855f7;
      border-radius: 10px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: #e9d5ff;
      display: block;
      transition: 0.2s;
    }
    .btn-up:hover { border-color: #f472b6; background: #230e3b; }
    .btn-up input { display: none; }
    .status { font-size: 11px; color: #f472b6; display: block; margin-top: 4px; }

    /* Control Box */
    .ctrl-box {
      background: rgba(35, 14, 58, 0.6);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #d8b4fe;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #d946ef;
      cursor: pointer;
    }

    .btn-dl {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #a855f7, #ec4899 60%, #f43f5e);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.45);
      letter-spacing: 1px;
      transition: 0.2s;
    }
    .btn-dl:hover { filter: brightness(1.1); transform: translateY(-1px); }

    .preview {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #581c87;
      box-shadow: 0 15px 50px rgba(0,0,0,0.95);
    }
    canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>

  <h1>AOV DIMENSION BREAKER STUDIO</h1>

  <div class="panel">
    <div class="upload-row">
      <label class="btn-up">
        <span>ẢNH 1 (TEL'ANNAS / CHÍNH TRÁI)</span>
        <span id="st1" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f1" accept="image/*">
      </label>
      <label class="btn-up">
        <span>ẢNH 2 (VIOLET / NẰM DƯỚI PHẢI)</span>
        <span id="st2" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f2" accept="image/*">
      </label>
    </div>

    <div class="ctrl-box">
      <div class="slider-row">
        <span>✂️ Xén bỏ nền xám thừa quanh thẻ:</span>
        <strong id="cropTxt">4%</strong>
      </div>
      <input type="range" id="cropSlider" min="0" max="12" step="0.5" value="4">

      <div class="slider-row" style="margin-top:4px;">
        <span>🧹 Độ lọc sạch góc thừa (Tolerance):</span>
        <strong id="tolTxt">40</strong>
      </div>
      <input type="range" id="tolSlider" min="15" max="80" value="40">
    </div>

    <button class="btn-dl" id="btnDl">⬇️ TẢI ẢNH FULL HD CHUẨN MẪU (9:16)</button>
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let rawImg1 = null, rawImg2 = null;
    let cleanImg1 = null, cleanImg2 = null;

    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const st1 = document.getElementById('st1');
    const st2 = document.getElementById('st2');
    const cropSlider = document.getElementById('cropSlider');
    const cropTxt = document.getElementById('cropTxt');
    const tolSlider = document.getElementById('tolSlider');
    const tolTxt = document.getElementById('tolTxt');
    const btnDl = document.getElementById('btnDl');

    cropSlider.addEventListener('input', (e) => {
      cropTxt.innerText = e.target.value + "%";
      processBothImages();
    });

    tolSlider.addEventListener('input', (e) => {
      tolTxt.innerText = e.target.value;
      processBothImages();
    });

    f1.addEventListener('change', (e) => loadImg(e.target.files[0], 1));
    f2.addEventListener('change', (e) => loadImg(e.target.files[0], 2));

    function loadImg(file, idx) {
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        const im = new Image();
        im.onload = () => {
          if (idx === 1) { rawImg1 = im; st1.innerText = "✅ Đã nhận"; }
          else { rawImg2 = im; st2.innerText = "✅ Đã nhận"; }
          processBothImages();
        };
        im.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    function processBothImages() {
      const crop = parseFloat(cropSlider.value) / 100;
      const tol = parseInt(tolSlider.value);
      if (rawImg1) cleanImg1 = cleanAndCropCard(rawImg1, crop, tol);
      if (rawImg2) cleanImg2 = cleanAndCropCard(rawImg2, crop, tol);
      render();
    }

    // THUẬT TOÁN KẾT HỢP: VỪA XÉN VIỀN VỪA KHỬ ĐIỂM XÁM THỪA Ở 4 GÓC
    function cleanAndCropCard(source, cropP, tol) {
      const off = document.createElement('canvas');
      const cx = source.width * cropP;
      const cy = source.height * cropP;
      const cw = source.width - (cx * 2);
      const ch = source.height - (cy * 2);

      off.width = cw;
      off.height = ch;
      const oCtx = off.getContext('2d');
      oCtx.drawImage(source, cx, cy, cw, ch, 0, 0, cw, ch);

      // Xóa trong suốt 4 góc bị lem nền xám
      const imgData = oCtx.getImageData(0, 0, cw, ch);
      const d = imgData.data;
      const seeds = [[0,0], [cw-1, 0], [0, ch-1], [cw-1, ch-1]];
      const visited = new Uint8Array(cw * ch);

      seeds.forEach(([sx, sy]) => {
        const sIdx = (sy * cw + sx) * 4;
        const sr = d[sIdx], sg = d[sIdx+1], sb = d[sIdx+2];
        const q = [[sx, sy]];

        while (q.length > 0) {
          const [x, y] = q.pop();
          const p = (y * cw + x) * 4;
          const v = y * cw + x;
          if (visited[v]) continue;
          visited[v] = 1;

          const dist = Math.sqrt(Math.pow(d[p]-sr,2) + Math.pow(d[p+1]-sg,2) + Math.pow(d[p+2]-sb,2));
          if (dist <= tol) {
            d[p + 3] = 0; // Trong suốt
            if (x > 0 && !visited[v - 1]) q.push([x - 1, y]);
            if (x < cw - 1 && !visited[v + 1]) q.push([x + 1, y]);
            if (y > 0 && !visited[v - cw]) q.push([x, y - 1]);
            if (y < ch - 1 && !visited[v + cw]) q.push([x, y + 1]);
          }
        }
      });

      oCtx.putImageData(imgData, 0, 0);
      return off;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#07020e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!cleanImg1 && !cleanImg2) {
        ctx.fillStyle = "#c084fc";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Vui lòng tải 2 ảnh thẻ lên để tạo", canvas.width / 2, canvas.height / 2);
        return;
      }

      // 1. VẼ NỀN ANIME CẬN CẢNH TRÊN & DƯỚI
      drawAnimeBg();

      // 2. CÁC TIA SÁNG CHÉO & CHỮ GLITCH NỀN
      drawBackgroundFX();

      // 3. CÁC THẺ PHỤ XẾP TẦNG (CASCADE CARDS)
      drawCascadeCards();

      // 4. HAI THẺ CHÍNH ĐỐI XỨNG Ở TRUNG TÂM
      drawCenterDuoCards();

      // 5. TIA CHÉM LASER TRẮNG SÁNG & CHROMATIC ABERRATION (GLITCH RGB)
      drawTopSlashFX();
    }

    function drawAnimeBg() {
      // ẢNH TRÊN: Violet ngắm bắn cận cảnh
      const topImg = rawImg2 || rawImg1;
      if (topImg) {
        ctx.save();
        ctx.translate(canvas.width / 2 + 30, 240);
        ctx.rotate(-0.08);
        ctx.filter = "contrast(1.4) saturate(1.8) brightness(0.85)";
        ctx.drawImage(topImg, -850, -500, 1700, 1000);
        ctx.restore();
      }

      // ẢNH DƯỚI: Tel'Annas kéo cung cận cảnh
      const btmImg = rawImg1 || rawImg2;
      if (btmImg) {
        ctx.save();
        ctx.translate(canvas.width / 2 - 20, 1680);
        ctx.rotate(0.08);
        ctx.filter = "contrast(1.45) saturate(1.8) brightness(0.9)";
        ctx.drawImage(btmImg, -850, -500, 1700, 1000);
        ctx.restore();
      }

      // Lớp gradient tím huyền ảo ở giữa màn hình
      const grad = ctx.createLinearGradient(0, 360, 0, 1560);
      grad.addColorStop(0, "rgba(7, 2, 14, 0.3)");
      grad.addColorStop(0.35, "rgba(35, 10, 68, 0.85)");
      grad.addColorStop(0.65, "rgba(35, 10, 68, 0.85)");
      grad.addColorStop(1, "rgba(7, 2, 14, 0.3)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawBackgroundFX() {
      // Chữ xiên nghệ thuật lượn sóng
      ctx.save();
      ctx.rotate(-0.35);
      ctx.font = "italic 900 66px sans-serif";
      ctx.fillStyle = "rgba(233, 213, 255, 0.1)";
      for (let y = -400; y < 2500; y += 140) {
        ctx.fillText("DIMENSION BREAKER • THỨ NGUYÊN VỆ THẦN • AOV", -650, y);
      }
      ctx.restore();

      // Các tia sọc ánh sáng chéo 45 độ
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.08)";
      ctx.lineWidth = 40;
      for (let x = -500; x < 2000; x += 300) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 1200, 1920);
        ctx.stroke();
      }
      ctx.restore();
    }

    // HÀM VẼ TỪNG THẺ VỚI ĐỘ SÂU 3D & VIỀN BẠC
    function drawSingleCard(img, x, y, w, h, angle, alpha = 1.0, isMain = false) {
      if (!img) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;

      if (isMain) {
        // Đổ bóng sâu
        ctx.shadowColor = "rgba(5, 0, 15, 0.95)";
        ctx.shadowBlur = 45;
        ctx.shadowOffsetX = 18;
        ctx.shadowOffsetY = 28;

        // Viền ánh tím phát quang quanh thẻ
        ctx.strokeStyle = "rgba(216, 180, 254, 0.95)";
        ctx.lineWidth = 4;
        ctx.strokeRect(-w/2, -h/2, w, h);

        ctx.strokeStyle = "rgba(255, 255, 255, 0.7)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-w/2 + 2, -h/2 + 2, w - 4, h - 4);
      } else {
        // Hiệu ứng thẻ phụ trượt mờ
        ctx.shadowColor = "rgba(147, 51, 234, 0.5)";
        ctx.shadowBlur = 20;
      }

      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    }

    // VẼ CÁC THẺ PHỤ XẾP TẦNG SO LE (CASCADE)
    function drawCascadeCards() {
      const w = 450;
      const h = 790;

      // Cụm thẻ phía sau bên phải (Violet): 2 thẻ so le
      if (cleanImg2) {
        drawSingleCard(cleanImg2, 850, 840, w, h, 0.16, 0.45);
        drawSingleCard(cleanImg2, 790, 810, w, h, 0.14, 0.75);
      }

      // Cụm thẻ phía sau bên trái (Tel'Annas): 1 thẻ nhô lên góc trên
      if (cleanImg1) {
        drawSingleCard(cleanImg1, 310, 720, w, h, -0.20, 0.45);
        drawSingleCard(cleanImg1, 220, 1150, w, h, -0.22, 0.35);
      }
    }

    function drawCenterDuoCards() {
      const cardW = 485;
      const cardH = 845;

      // THẺ 2 (VIOLET) - Nằm phía sau bên phải
      if (cleanImg2) {
        drawSingleCard(cleanImg2, 690, 780, cardW, cardH, 0.10, 1.0, true);
      }

      // THẺ 1 (TEL'ANNAS) - ĐÈ CHÉO LÊN TRÊN BÊN TRÁI CHUẨN XÁC
      if (cleanImg1) {
        drawSingleCard(cleanImg1, 380, 880, cardW, cardH, -0.15, 1.0, true);
      }
    }

    function drawTopSlashFX() {
      // 1. ĐỐM SÁNG LÓA VƯƠNG MIỆN (GLINT FLARES)
      drawGlint(335, 480);
      drawGlint(720, 430);

      // 2. VỆT TIA CHÉM LASER SẮC LẸM CẮT NGANG
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-50, 1780);
      ctx.lineTo(1150, 1560);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.98)";
      ctx.lineWidth = 5;
      ctx.shadowColor = "#f472b6";
      ctx.shadowBlur = 30;
      ctx.stroke();

      // Vầng sáng hào quang của nhát chém
      ctx.lineWidth = 18;
      ctx.strokeStyle = "rgba(216, 180, 254, 0.35)";
      ctx.stroke();
      ctx.restore();

      // 3. SỌC SCANLINES MÀN HÌNH ANIME
      ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
      for (let y = 0; y < canvas.height; y += 4) {
        ctx.fillRect(0, y, canvas.width, 1.5);
      }

      // 4. VIGNETTE TỐI 4 MÉP
      const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 450, canvas.width/2, canvas.height/2, 1150);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(5, 1, 10, 0.85)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlint(x, y) {
      ctx.save();
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 25;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - 25, y); ctx.lineTo(x + 25, y);
      ctx.moveTo(x, y - 25); ctx.lineTo(x, y + 25);
      ctx.stroke();
      ctx.restore();
    }

    btnDl.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `AOV-DimensionBreaker-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });

    render();
  </script>
</body>
</html>
