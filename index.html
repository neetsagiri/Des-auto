<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOV Dimension Breaker - Ultra Edition</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #040108;
      color: #f3e8ff;
      padding: 14px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 19px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff, #d8b4fe 40%, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
      text-align: center;
      font-weight: 900;
    }
    .panel {
      width: 100%;
      max-width: 480px;
      background: rgba(18, 8, 30, 0.95);
      border: 1px solid rgba(192, 132, 252, 0.4);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }
    .btn-up {
      background: #140724;
      border: 1.5px dashed #a855f7;
      border-radius: 8px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: #e9d5ff;
      display: block;
      transition: 0.2s;
    }
    .btn-up:hover { border-color: #f472b6; }
    .btn-up input { display: none; }
    .status { font-size: 11px; color: #f472b6; display: block; margin-top: 4px; }

    .ctrl-box {
      background: rgba(30, 12, 50, 0.6);
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .slider-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #d8b4fe;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #d946ef;
      cursor: pointer;
    }

    .btn-dl {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #9333ea, #ec4899 50%, #f43f5e);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(236, 72, 153, 0.45);
      letter-spacing: 1px;
    }
    .btn-dl:hover { filter: brightness(1.1); }

    .preview {
      width: 100%;
      max-width: 410px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #581c87;
      box-shadow: 0 15px 50px rgba(0,0,0,0.95);
    }
    canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>

  <h1>AOV Dimension Breaker Studio</h1>

  <div class="panel">
    <div class="upload-row">
      <label class="btn-up">
        <span>ẢNH 1 (TEL / NAK - ĐÈ TRÊN)</span>
        <span id="st1" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f1" accept="image/*">
      </label>
      <label class="btn-up">
        <span>ẢNH 2 (VIOLET - NẰM DƯỚI)</span>
        <span id="st2" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f2" accept="image/*">
      </label>
    </div>

    <div class="ctrl-box">
      <div class="slider-row">
        <span>✂️ Xén rìa thừa cạnh ngoài:</span>
        <strong id="cropTxt">4%</strong>
      </div>
      <input type="range" id="cropSlider" min="0" max="10" step="0.5" value="4">

      <div class="slider-row" style="margin-top:2px;">
        <span>🧹 Lọc sạch nền xám góc:</span>
        <strong id="tolTxt">42</strong>
      </div>
      <input type="range" id="tolSlider" min="15" max="80" value="42">
    </div>

    <button class="btn-dl" id="btnDl">⬇️ TẢI ẢNH ULTRA-HD (9:16)</button>
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let rawImg1 = null, rawImg2 = null;
    let cleanImg1 = null, cleanImg2 = null;

    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const st1 = document.getElementById('st1');
    const st2 = document.getElementById('st2');
    const cropSlider = document.getElementById('cropSlider');
    const cropTxt = document.getElementById('cropTxt');
    const tolSlider = document.getElementById('tolSlider');
    const tolTxt = document.getElementById('tolTxt');
    const btnDl = document.getElementById('btnDl');

    cropSlider.addEventListener('input', (e) => {
      cropTxt.innerText = e.target.value + "%";
      processImages();
    });

    tolSlider.addEventListener('input', (e) => {
      tolTxt.innerText = e.target.value;
      processImages();
    });

    f1.addEventListener('change', (e) => load(e.target.files[0], 1));
    f2.addEventListener('change', (e) => load(e.target.files[0], 2));

    function load(file, idx) {
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        const im = new Image();
        im.onload = () => {
          if (idx === 1) { rawImg1 = im; st1.innerText = "✅ Đã tải ảnh 1"; }
          else { rawImg2 = im; st2.innerText = "✅ Đã tải ảnh 2"; }
          processImages();
        };
        im.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    function processImages() {
      const crop = parseFloat(cropSlider.value) / 100;
      const tol = parseInt(tolSlider.value);
      if (rawImg1) cleanImg1 = prepareCleanCard(rawImg1, crop, tol);
      if (rawImg2) cleanImg2 = prepareCleanCard(rawImg2, crop, tol);
      render();
    }

    function prepareCleanCard(src, cropP, tol) {
      const off = document.createElement('canvas');
      const cx = src.width * cropP;
      const cy = src.height * cropP;
      const cw = src.width - (cx * 2);
      const ch = src.height - (cy * 2);

      off.width = cw;
      off.height = ch;
      const oCtx = off.getContext('2d');
      oCtx.drawImage(src, cx, cy, cw, ch, 0, 0, cw, ch);

      const imgData = oCtx.getImageData(0, 0, cw, ch);
      const d = imgData.data;
      const seeds = [[0,0], [cw-1, 0], [0, ch-1], [cw-1, ch-1], [Math.floor(cw/2), 0]];
      const visited = new Uint8Array(cw * ch);

      seeds.forEach(([sx, sy]) => {
        const sIdx = (sy * cw + sx) * 4;
        const sr = d[sIdx], sg = d[sIdx+1], sb = d[sIdx+2];
        const q = [[sx, sy]];

        while (q.length > 0) {
          const [x, y] = q.pop();
          const p = (y * cw + x) * 4;
          const v = y * cw + x;
          if (visited[v]) continue;
          visited[v] = 1;

          const dist = Math.sqrt(Math.pow(d[p]-sr,2) + Math.pow(d[p+1]-sg,2) + Math.pow(d[p+2]-sb,2));
          if (dist <= tol) {
            d[p + 3] = 0;
            if (x > 0 && !visited[v - 1]) q.push([x - 1, y]);
            if (x < cw - 1 && !visited[v + 1]) q.push([x + 1, y]);
            if (y > 0 && !visited[v - cw]) q.push([x, y - 1]);
            if (y < ch - 1 && !visited[v + cw]) q.push([x, y + 1]);
          }
        }
      });

      oCtx.putImageData(imgData, 0, 0);
      return off;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#050109";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!cleanImg1 && !cleanImg2) {
        ctx.fillStyle = "#c084fc";
        ctx.font = "bold 26px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Vui lòng tải 2 ảnh thẻ lên để des", canvas.width / 2, canvas.height / 2);
        return;
      }

      // 1. LỚP NỀN ANIME CẬN CẢNH (ĐẨY CAO SẮC ĐỘ & TƯƠNG PHẢN)
      drawAnimeBg();

      // 2. VỆT CHỮ MANGA / ANIME CHẠY CHÉO ĐA TẦNG
      drawMangaTextGlitch();

      // 3. CÁC THẺ PHỤ TRƯỢT 3D XẾP TẦNG (CASCADE MOTION TRAIL)
      drawCascadeTrailCards();

      // 4. HAI THẺ CHÍNH ĐỐI XỨNG PHÁT QUANG
      drawCoreCards();

      // 5. FX NÂNG CAO: TIA LASER TRẮNG SÁNG, ĐỐM SÁNG CHỮ THẬP & SCANLINES
      drawHighEndFX();
    }

    function drawAnimeBg() {
      // ẢNH TRÊN: Cận cảnh khuôn mặt trên (Violet)
      const topImg = rawImg2 || rawImg1;
      if (topImg) {
        ctx.save();
        ctx.translate(canvas.width / 2 + 50, 240);
        ctx.rotate(-0.09);
        ctx.filter = "contrast(1.45) saturate(1.85) brightness(0.88)";
        ctx.drawImage(topImg, -850, -500, 1700, 1000);
        ctx.restore();
      }

      // ẢNH DƯỚI: Cận cảnh Tel'Annas kéo cung
      const btmImg = rawImg1 || rawImg2;
      if (btmImg) {
        ctx.save();
        ctx.translate(canvas.width / 2 - 40, 1680);
        ctx.rotate(0.08);
        ctx.filter = "contrast(1.5) saturate(1.85) brightness(0.92)";
        ctx.drawImage(btmImg, -850, -500, 1700, 1000);
        ctx.restore();
      }

      // Gradient chuyển màu trung tâm: Tím neon huyền ảo
      const grad = ctx.createLinearGradient(0, 360, 0, 1560);
      grad.addColorStop(0, "rgba(5, 1, 10, 0.3)");
      grad.addColorStop(0.32, "rgba(42, 10, 78, 0.85)");
      grad.addColorStop(0.68, "rgba(42, 10, 78, 0.85)");
      grad.addColorStop(1, "rgba(5, 1, 10, 0.3)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawMangaTextGlitch() {
      ctx.save();
      ctx.rotate(-0.34);

      // Chữ tiếng Anh & Tiếng Việt nghệ thuật
      ctx.font = "italic 900 64px sans-serif";
      ctx.fillStyle = "rgba(233, 213, 255, 0.08)";
      for (let y = -400; y < 2500; y += 135) {
        ctx.fillText("DIMENSION BREAKER • THỨ NGUYÊN VỆ THẦN", -600, y);
      }

      // Chữ Katakana phong cách Anime Nhật Bản chạy chéo
      ctx.font = "900 32px sans-serif";
      ctx.fillStyle = "rgba(244, 114, 182, 0.12)";
      for (let y = -350; y < 2500; y += 135) {
        ctx.fillText("ディメンション・ブレイカー • ヴァイオレット • テルアナス", -550, y + 45);
      }
      ctx.restore();

      // Dải ánh sáng chéo 45 độ
      ctx.save();
      ctx.strokeStyle = "rgba(255, 255, 255, 0.06)";
      ctx.lineWidth = 35;
      for (let x = -500; x < 2000; x += 320) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + 1200, 1920);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCardObject(img, x, y, w, h, angle, alpha = 1.0, isMain = false) {
      if (!img) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;

      if (isMain) {
        // Đổ bóng 3D cực sâu
        ctx.shadowColor = "rgba(3, 0, 10, 0.95)";
        ctx.shadowBlur = 45;
        ctx.shadowOffsetX = 18;
        ctx.shadowOffsetY = 28;

        // Viền ánh tím bạc phát quang quanh thẻ
        ctx.strokeStyle = "rgba(233, 213, 255, 0.95)";
        ctx.lineWidth = 3.5;
        ctx.strokeRect(-w/2, -h/2, w, h);

        ctx.strokeStyle = "rgba(244, 114, 182, 0.6)";
        ctx.lineWidth = 1.5;
        ctx.strokeRect(-w/2 + 2, -h/2 + 2, w - 4, h - 4);
      } else {
        ctx.shadowColor = "rgba(147, 51, 234, 0.4)";
        ctx.shadowBlur = 18;
      }

      ctx.drawImage(img, -w/2, -h/2, w, h);
      ctx.restore();
    }

    function drawCascadeTrailCards() {
      const w = 455;
      const h = 800;

      // Cụm thẻ phía sau của Violet (Nghiêng nhẹ +0.15 sang phải)
      if (cleanImg2) {
        drawCardObject(cleanImg2, 850, 850, w, h, 0.16, 0.45);
        drawCardObject(cleanImg2, 790, 810, w, h, 0.13, 0.75);
      }

      // Cụm thẻ phía sau của Tel'Annas (Nghiêng -0.20 sang trái)
      if (cleanImg1) {
        drawCardObject(cleanImg1, 310, 720, w, h, -0.20, 0.45);
        drawCardObject(cleanImg1, 210, 1160, w, h, -0.22, 0.35);
      }
    }

    function drawCoreCards() {
      const cardW = 490;
      const cardH = 855;

      // THẺ 2 (VIOLET) - Nằm phía sau bên phải
      if (cleanImg2) {
        drawCardObject(cleanImg2, 690, 780, cardW, cardH, 0.10, 1.0, true);
      }

      // THẺ 1 (TEL'ANNAS) - ĐÈ CHÉO LÊN TRÊN BÊN TRÁI ĐÚNG GÓC MẪU
      if (cleanImg1) {
        drawCardObject(cleanImg1, 380, 880, cardW, cardH, -0.15, 1.0, true);
      }
    }

    function drawHighEndFX() {
      // 1. ĐỐM LÓA SÁNG CHỮ THẬP (GLINT / FLARE)
      drawGlintCross(335, 480);
      drawGlintCross(720, 430);

      // 2. NHÁT CHÉM LASER TRẮNG SÁNG CẮT NGANG NỬA DƯỚI (SLASH BEAM)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-60, 1780);
      ctx.lineTo(1160, 1560);
      ctx.strokeStyle = "rgba(255, 255, 255, 0.98)";
      ctx.lineWidth = 6;
      ctx.shadowColor = "#f472b6";
      ctx.shadowBlur = 35;
      ctx.stroke();

      // Vầng hào quang của nhát chém
      ctx.lineWidth = 22;
      ctx.strokeStyle = "rgba(216, 180, 254, 0.4)";
      ctx.stroke();
      ctx.restore();

      // 3. CÁC HẠT BỤI NĂNG LƯỢNG LẤP LÁNH (SPARKLES)
      ctx.save();
      for (let i = 0; i < 40; i++) {
        const sx = (i * 137) % canvas.width;
        const sy = (i * 97) % canvas.height;
        const sr = (i % 3) + 1.5;
        ctx.fillStyle = (i % 2 === 0) ? "rgba(255, 255, 255, 0.7)" : "rgba(244, 114, 182, 0.6)";
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();

      // 4. SCANLINES MÀN HÌNH RETRO ANIME
      ctx.fillStyle = "rgba(0, 0, 0, 0.12)";
      for (let y = 0; y < canvas.height; y += 4) {
        ctx.fillRect(0, y, canvas.width, 1.5);
      }

      // 5. VIGNETTE TỐI 4 GÓC ĐIỆN ẢNH
      const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 450, canvas.width/2, canvas.height/2, 1150);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(4, 1, 8, 0.85)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlintCross(x, y) {
      ctx.save();
      ctx.shadowColor = "#ffffff";
      ctx.shadowBlur = 25;
      ctx.fillStyle = "#ffffff";
      ctx.beginPath();
      ctx.arc(x, y, 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.85)";
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(x - 26, y); ctx.lineTo(x + 26, y);
      ctx.moveTo(x, y - 26); ctx.lineTo(x, y + 26);
      ctx.stroke();
      ctx.restore();
    }

    btnDl.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `AOV-DimensionBreaker-Ultra-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });

    render();
  </script>
</body>
</html>
