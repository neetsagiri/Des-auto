<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOV Dimension Breaker - Auto Des Card Đôi</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,700;0,900;1,900&family=Teko:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #090611;
      color: #e2e8f0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-family: 'Teko', sans-serif;
      font-size: 32px;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #e9d5ff, #c084fc, #9333ea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      margin-bottom: 15px;
    }
    .panel {
      width: 100%;
      max-width: 600px;
      background: rgba(23, 15, 38, 0.85);
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8);
      margin-bottom: 20px;
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 12px;
    }
    .upload-btn {
      background: #1f1430;
      border: 1.5px dashed #a855f7;
      border-radius: 10px;
      padding: 12px 8px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
      color: #d8b4fe;
    }
    .upload-btn input { display: none; }
    .status { font-size: 11px; color: #a855f7; display: block; margin-top: 4px; }

    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      padding: 8px 10px;
      background: #120920;
      border: 1px solid #6b21a8;
      border-radius: 6px;
      color: #fff;
      font-size: 12px;
    }
    input:focus { border-color: #c084fc; outline: none; }

    .btn-download {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #9333ea, #c084fc);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 900;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      box-shadow: 0 0 15px rgba(147, 51, 234, 0.5);
    }
    .preview-box {
      width: 100%;
      max-width: 420px; /* Khung xem trước dạng điện thoại */
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #581c87;
      box-shadow: 0 15px 40px rgba(0,0,0,0.9);
    }
    canvas {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>

  <h1>DIMENSION BREAKER EDIT STUDIO</h1>

  <div class="panel">
    <div class="upload-row">
      <label class="upload-btn">
        <span>ẢNH 1 (TƯỚNG TRÊN / TRÁI)</span>
        <span id="st1" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f1" accept="image/*">
      </label>
      <label class="upload-btn">
        <span>ẢNH 2 (TƯỚNG DƯỚI / PHẢI)</span>
        <span id="st2" class="status">Chưa chọn ảnh</span>
        <input type="file" id="f2" accept="image/*">
      </label>
    </div>

    <div class="input-grid">
      <input type="text" id="skin1" value="Thứ nguyên vệ thần" placeholder="Skin 1">
      <input type="text" id="skin2" value="Thứ nguyên vệ thần" placeholder="Skin 2">
      <input type="text" id="hero1" value="Tel'Annas" placeholder="Tên tướng 1">
      <input type="text" id="hero2" value="Violet" placeholder="Tên tướng 2">
      <input type="text" id="name1" value="ThuỷThầnTinhVân" placeholder="Ingame 1">
      <input type="text" id="name2" value="rt4Eunsung." placeholder="Ingame 2">
    </div>

    <button class="btn-download" id="btnDl">⬇️ TẢI ẢNH FULL HD (9:16)</button>
  </div>

  <div class="preview-box">
    <!-- Khổ chuẩn Story/TikTok 1080 x 1920 -->
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let img1 = null;
    let img2 = null;

    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const st1 = document.getElementById('st1');
    const st2 = document.getElementById('st2');
    const btnDl = document.getElementById('btnDl');

    const inputs = ['skin1', 'skin2', 'hero1', 'hero2', 'name1', 'name2'];
    inputs.forEach(id => document.getElementById(id).addEventListener('input', render));

    f1.addEventListener('change', (e) => load(e.target.files[0], 1));
    f2.addEventListener('change', (e) => load(e.target.files[0], 2));

    function load(file, idx) {
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        const im = new Image();
        im.onload = () => {
          if (idx === 1) { img1 = im; st1.innerText = "✅ Đã nhận ảnh 1"; }
          else { img2 = im; st2.innerText = "✅ Đã nhận ảnh 2"; }
          render();
        };
        im.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. VẼ NỀN ANIME TÍM LỚN (TRÊN & DƯỚI)
      drawAnimeBackground();

      // 2. VẼ CÁC CHỮ CHẠY XIÊN GLITCH PHÔNG NỀN (DIMENSION BREAKER)
      drawGlitchTextBackground();

      // 3. VẼ CÁC THẺ CARD ẢO NGHIÊNG XẾP LỚP Ở SAU (GHOST/ECHO CARDS)
      drawBackGhostCards();

      // 4. VẼ 2 THẺ CARD CHÍNH Ở TRUNG TÂM (ĐỐI XỨNG 3D TILT)
      drawMainPairCards();

      // 5. PHỦ LỚP MÀU ÁNH TÍM ANIME VÀ BỤI SÁNG
      drawAuraGlitchEffect();
    }

    function drawAnimeBackground() {
      ctx.fillStyle = "#0c0618";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Ảnh góc trên (Phóng to, hơi xoay nhẹ)
      if (img2 || img1) {
        ctx.save();
        ctx.translate(canvas.width / 2, 250);
        ctx.rotate(-0.08);
        ctx.filter = "contrast(1.2) brightness(0.65) saturate(1.4)";
        const bgImgTop = img2 || img1;
        ctx.drawImage(bgImgTop, -750, -450, 1500, 900);
        ctx.restore();
      }

      // Ảnh góc dưới (Phóng to, xoay nghiêng đối ứng)
      if (img1 || img2) {
        ctx.save();
        ctx.translate(canvas.width / 2, 1680);
        ctx.rotate(0.06);
        ctx.filter = "contrast(1.25) brightness(0.7) saturate(1.4)";
        const bgImgBtm = img1 || img2;
        ctx.drawImage(bgImgBtm, -750, -450, 1500, 900);
        ctx.restore();
      }

      // Lớp phủ Gradient Tím Đen giữa màn hình
      const midGrad = ctx.createLinearGradient(0, 450, 0, 1450);
      midGrad.addColorStop(0, "rgba(12, 6, 24, 0.4)");
      midGrad.addColorStop(0.5, "rgba(35, 10, 65, 0.85)");
      midGrad.addColorStop(1, "rgba(12, 6, 24, 0.4)");
      ctx.fillStyle = midGrad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawGlitchTextBackground() {
      ctx.save();
      ctx.rotate(-0.35);
      ctx.font = "italic 900 65px 'Montserrat'";
      ctx.fillStyle = "rgba(192, 132, 252, 0.15)";

      for (let y = -400; y < 2400; y += 180) {
        ctx.fillText("DIMENSION BREAKER • THỨ NGUYÊN VỆ THẦN • AOV", -500, y);
      }
      ctx.restore();
    }

    function drawBackGhostCards() {
      // Các thẻ mờ tạo chiều sâu chuyển động phía sau thẻ chính
      drawCardShape(-0.25, 300, 720, 360, 640, img1, 0.3, true);
      drawCardShape(0.28, 800, 1050, 360, 640, img2, 0.35, true);
      drawCardShape(-0.15, 680, 620, 360, 640, img2, 0.25, true);
    }

    function drawMainPairCards() {
      const cardW = 440;
      const cardH = 760;

      // THẺ CHÍNH PHẢI (VIOLET / THÀNH VIÊN 2) - NẰM LỚP DƯỚI MỘT CHÚT
      drawCardShape(
        0.18, 680, 880, cardW, cardH, img2, 1.0, false,
        document.getElementById('skin2').value,
        document.getElementById('hero2').value,
        document.getElementById('name2').value,
        "#d8b4fe"
      );

      // THẺ CHÍNH TRÁI (TEL'ANNAS / THÀNH VIÊN 1) - ĐÈ LÊN TRÊN
      drawCardShape(
        -0.16, 400, 960, cardW, cardH, img1, 1.0, false,
        document.getElementById('skin1').value,
        document.getElementById('hero1').value,
        document.getElementById('name1').value,
        "#c084fc"
      );
    }

    // HÀM VẼ KHUNG THẺ CHUẨN LIÊN QUÂN MOBILE
    function drawCardShape(rot, cx, cy, w, h, img, alpha, isGhost, skinText, heroText, ingameText, glowCol) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rot);
      ctx.globalAlpha = alpha;

      // Bóng đổ 3D sâu
      ctx.shadowColor = glowCol || "rgba(0,0,0,0.9)";
      ctx.shadowBlur = isGhost ? 15 : 45;
      ctx.shadowOffsetX = isGhost ? 5 : 12;
      ctx.shadowOffsetY = isGhost ? 5 : 20;

      // 1. Viền ngoài thẻ mạ kim loại bạc - tím
      ctx.strokeStyle = "#e9d5ff";
      ctx.lineWidth = 6;
      ctx.strokeRect(-w/2, -h/2, w, h);

      // Viền kép neon phụ
      ctx.strokeStyle = "#a855f7";
      ctx.lineWidth = 3;
      ctx.strokeRect(-w/2 + 6, -h/2 + 6, w - 12, h - 12);

      // 2. Vẽ hình ảnh bên trong
      ctx.save();
      ctx.beginPath();
      ctx.rect(-w/2 + 6, -h/2 + 6, w - 12, h - 12);
      ctx.clip();

      if (img) {
        // Tỉ lệ cover vừa khít thẻ
        const ratio = Math.max((w - 12) / img.width, (h - 12) / img.height);
        const sx = ((w - 12) - img.width * ratio) / 2;
        const sy = ((h - 12) - img.height * ratio) / 2;
        ctx.drawImage(img, 0, 0, img.width, img.height,
                      -w/2 + 6 + sx, -h/2 + 6 + sy, img.width * ratio, img.height * ratio);
      } else {
        ctx.fillStyle = "#1e1133";
        ctx.fillRect(-w/2, -h/2, w, h);
        ctx.fillStyle = "#a855f7";
        ctx.font = "bold 26px Montserrat";
        ctx.textAlign = "center";
        ctx.fillText("CHỌN ẢNH", 0, 0);
      }

      // Lớp gradient tối bên dưới để đọc chữ UI Game
      if (!isGhost) {
        const cardShade = ctx.createLinearGradient(0, h/2 - 320, 0, h/2);
        cardShade.addColorStop(0, "rgba(0,0,0,0)");
        cardShade.addColorStop(0.5, "rgba(10, 4, 20, 0.7)");
        cardShade.addColorStop(1, "rgba(10, 4, 20, 0.95)");
        ctx.fillStyle = cardShade;
        ctx.fillRect(-w/2, h/2 - 320, w, 320);
      }

      ctx.restore();

      // NẾU LÀ THẺ CHÍNH -> VẼ CÁC HUY HIỆU & THÔNG SỐ UI GAME
      if (!isGhost) {
        // Vương miện / Badge đỉnh thẻ
        ctx.fillStyle = "#ffd700";
        ctx.shadowColor = "#f59e0b";
        ctx.shadowBlur = 15;
        ctx.beginPath();
        ctx.arc(0, -h/2 + 10, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.font = "bold 14px Montserrat";
        ctx.textAlign = "center";
        ctx.fillText("SSS", 0, -h/2 + 15);

        // Logo Thần Vệ / Tag Skin
        ctx.fillStyle = "rgba(233, 213, 255, 0.95)";
        ctx.font = "italic 900 16px 'Montserrat'";
        ctx.shadowColor = "#9333ea";
        ctx.shadowBlur = 10;
        ctx.fillText("DIMENSION BREAKER", 0, h/2 - 185);

        // Tên Skin
        ctx.fillStyle = "#f3e8ff";
        ctx.font = "italic 600 21px 'Montserrat'";
        ctx.fillText(skinText || "Thứ nguyên vệ thần", 0, h/2 - 150);

        // Tên Tướng
        ctx.fillStyle = "#ffffff";
        ctx.font = "900 28px 'Montserrat'";
        ctx.shadowColor = "#000";
        ctx.shadowBlur = 8;
        ctx.fillText(heroText || "Tên Tướng", 0, h/2 - 110);

        // Dải Ingame Player
        ctx.fillStyle = "#d8b4fe";
        ctx.font = "bold 23px 'Montserrat'";
        ctx.fillText(ingameText || "Tên Ingame", 0, h/2 - 65);

        // Huy hiệu Thông Thạo S (Cấp 15) ở đáy thẻ
        ctx.fillStyle = "#7e22ce";
        ctx.strokeStyle = "#e9d5ff";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, h/2 - 20, 18, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 13px Montserrat";
        ctx.fillText("15", 0, h/2 - 15);
      }

      ctx.restore();
    }

    function drawAuraGlitchEffect() {
      ctx.save();
      // Ánh sáng tím bao trùm (Vignette)
      const glow = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 400, canvas.width/2, canvas.height/2, 1100);
      glow.addColorStop(0, "rgba(147, 51, 234, 0.0)");
      glow.addColorStop(1, "rgba(8, 3, 15, 0.75)");
      ctx.fillStyle = glow;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Các tia sáng lấp lánh chéo
      ctx.strokeStyle = "rgba(233, 213, 255, 0.35)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(100, 1500);
      ctx.lineTo(950, 1620);
      ctx.stroke();
      ctx.restore();
    }

    btnDl.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `AOV-DimensionBreaker-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });

    render();
  </script>
</body>
</html>
