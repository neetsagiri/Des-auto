<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AOV Loading Edit Studio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #080410;
      color: #e2e8f0;
      padding: 20px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h1 {
      font-size: 22px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #c084fc, #e879f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      text-align: center;
    }
    .panel {
      width: 100%;
      max-width: 500px;
      background: #140b24;
      border: 1px solid #3b1861;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }
    .upload-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }
    .btn-up {
      background: #201238;
      border: 1.5px dashed #8b5cf6;
      border-radius: 8px;
      padding: 12px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      color: #c084fc;
    }
    .btn-up input { display: none; }
    .status { font-size: 11px; color: #a855f7; display: block; margin-top: 4px; }
    .btn-dl {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #9333ea, #c084fc);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 0 15px rgba(147, 51, 234, 0.4);
    }
    .preview {
      width: 100%;
      max-width: 420px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1.5px solid #4c1d95;
      box-shadow: 0 10px 30px rgba(0,0,0,0.9);
    }
    canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>

  <h1>AOV Loading Card Editor</h1>

  <div class="panel">
    <div class="upload-row">
      <label class="btn-up">
        <span>ẢNH CARD 1 (TRÁI)</span>
        <span id="st1" class="status">Chưa có ảnh</span>
        <input type="file" id="f1" accept="image/*">
      </label>
      <label class="btn-up">
        <span>ẢNH CARD 2 (PHẢI)</span>
        <span id="st2" class="status">Chưa có ảnh</span>
        <input type="file" id="f2" accept="image/*">
      </label>
    </div>
    <button class="btn-dl" id="btnDl">⬇️ TẢI ẢNH FULL HD (9:16)</button>
  </div>

  <div class="preview">
    <canvas id="canvas" width="1080" height="1920"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let img1 = null;
    let img2 = null;

    const f1 = document.getElementById('f1');
    const f2 = document.getElementById('f2');
    const st1 = document.getElementById('st1');
    const st2 = document.getElementById('st2');
    const btnDl = document.getElementById('btnDl');

    f1.addEventListener('change', (e) => loadImg(e.target.files[0], 1));
    f2.addEventListener('change', (e) => loadImg(e.target.files[0], 2));

    function loadImg(file, idx) {
      if (!file) return;
      const r = new FileReader();
      r.onload = (e) => {
        const im = new Image();
        im.onload = () => {
          if (idx === 1) { img1 = im; st1.innerText = "✅ Đã nhận"; }
          else { img2 = im; st2.innerText = "✅ Đã nhận"; }
          render();
        };
        im.src = e.target.result;
      };
      r.readAsDataURL(file);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Nền đen sâu
      ctx.fillStyle = "#07030e";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (!img1 && !img2) {
        ctx.fillStyle = "#a855f7";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("Vui lòng tải 2 ảnh thẻ loading lên", canvas.width / 2, canvas.height / 2);
        return;
      }

      // 1. VẼ NỀN ANIME PHÓNG TO TRÊN VÀ DƯỚI (CHUẨN GÓC VÁT NHƯ MẪU)
      drawBackgroundArt();

      // 2. CHỮ CHẠY XIÊN MỜ NGHỆ THUẬT PHÍA SAU
      drawSlantedTextOverlay();

      // 3. VẼ DẢI THẺ XẾP LỚP PHÍA SAU (MOTION TRAIL CARDS)
      drawMotionTrailCards();

      // 4. VẼ 2 THẺ CHÍNH Ở TRUNG TÂM (ĐỐI XỨNG GÓC NGHIÊNG 3D)
      drawCenterMainCards();

      // 5. HIỆU ỨNG SCANLINES (SỌC MÀN HÌNH ANIME) VÀ TONE MÀU TÍM LẠNH
      drawScanlinesAndTone();
    }

    function drawBackgroundArt() {
      // Ảnh trên (Lấy thẻ 2 hoặc 1)
      const topImg = img2 || img1;
      if (topImg) {
        ctx.save();
        ctx.translate(canvas.width / 2, 280);
        ctx.rotate(-0.06);
        ctx.filter = "contrast(1.25) saturate(1.5) brightness(0.65)";
        ctx.drawImage(topImg, -800, -500, 1600, 1000);
        ctx.restore();
      }

      // Ảnh dưới (Lấy thẻ 1 hoặc 2)
      const btmImg = img1 || img2;
      if (btmImg) {
        ctx.save();
        ctx.translate(canvas.width / 2, 1640);
        ctx.rotate(0.05);
        ctx.filter = "contrast(1.3) saturate(1.5) brightness(0.7)";
        ctx.drawImage(btmImg, -800, -500, 1600, 1000);
        ctx.restore();
      }

      // Lớp gradient tím sẫm hòa trộn ở giữa màn hình
      const grad = ctx.createLinearGradient(0, 350, 0, 1550);
      grad.addColorStop(0, "rgba(8, 4, 16, 0.35)");
      grad.addColorStop(0.3, "rgba(22, 7, 45, 0.85)");
      grad.addColorStop(0.7, "rgba(22, 7, 45, 0.85)");
      grad.addColorStop(1, "rgba(8, 4, 16, 0.35)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    function drawSlantedTextOverlay() {
      ctx.save();
      ctx.rotate(-0.32);
      ctx.font = "italic 900 70px sans-serif";
      ctx.fillStyle = "rgba(192, 132, 252, 0.08)";
      for (let y = -400; y < 2500; y += 170) {
        ctx.fillText("DIMENSION BREAKER • THỨ NGUYÊN VỆ THẦN • AOV", -600, y);
      }
      ctx.restore();
    }

    // Vẽ thẻ thuần túy (Không chèn chữ nhân tạo vào nữa)
    function drawRawCard(img, x, y, w, h, angle, shadowBlur = 35, alpha = 1.0) {
      if (!img) return;
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.globalAlpha = alpha;

      // Bóng đổ xiên tạo độ sâu 3D
      ctx.shadowColor = "rgba(147, 51, 234, 0.45)";
      ctx.shadowBlur = shadowBlur;
      ctx.shadowOffsetX = 12;
      ctx.shadowOffsetY = 24;

      // Bo viền phát sáng nhẹ quanh thẻ
      ctx.strokeStyle = "rgba(233, 213, 255, 0.85)";
      ctx.lineWidth = 3;
      ctx.strokeRect(-w/2, -h/2, w, h);

      // Vẽ hình ảnh thật của thẻ loading
      ctx.drawImage(img, -w/2, -h/2, w, h);

      ctx.restore();
    }

    function drawMotionTrailCards() {
      const w = 450;
      const h = 780;

      // Dải thẻ phía sau góc bên phải (tạo cảm giác quạt thẻ như mẫu)
      if (img2) {
        drawRawCard(img2, 760, 930, w, h, 0.32, 15, 0.35);
        drawRawCard(img2, 720, 890, w, h, 0.26, 20, 0.55);
      }

      // Dải thẻ phía sau góc bên trái
      if (img1) {
        drawRawCard(img1, 330, 990, w, h, -0.26, 15, 0.35);
        drawRawCard(img1, 370, 950, w, h, -0.20, 20, 0.55);
      }
    }

    function drawCenterMainCards() {
      const cardW = 470;
      const cardH = 810;

      // THẺ 2 (BÊN PHẢI - NẰM LỚP DƯỚI)
      if (img2) {
        drawRawCard(img2, 680, 860, cardW, cardH, 0.16, 45, 1.0);
      }

      // THẺ 1 (BÊN TRÁI - ĐÈ LÊN TRÊN NỔI BẬT NHẤT)
      if (img1) {
        drawRawCard(img1, 410, 950, cardW, cardH, -0.14, 55, 1.0);
      }
    }

    function drawScanlinesAndTone() {
      // 1. Phủ sọc Scanlines dạng màn hình tivi anime cổ điển
      ctx.fillStyle = "rgba(0, 0, 0, 0.15)";
      for (let y = 0; y < canvas.height; y += 5) {
        ctx.fillRect(0, y, canvas.width, 2);
      }

      // 2. Vệt sáng cắt chéo (Lens flare slash)
      ctx.save();
      ctx.strokeStyle = "rgba(233, 213, 255, 0.35)";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#c084fc";
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.moveTo(80, 1420);
      ctx.lineTo(1000, 1540);
      ctx.stroke();
      ctx.restore();

      // 3. Phủ gradient tối 4 mép cạnh (Vignette điện ảnh)
      const vig = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 450, canvas.width/2, canvas.height/2, 1150);
      vig.addColorStop(0, "rgba(0,0,0,0)");
      vig.addColorStop(1, "rgba(5, 2, 10, 0.85)");
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }

    btnDl.addEventListener('click', () => {
      const a = document.createElement('a');
      a.download = `AOV-Loading-Edit-${Date.now()}.png`;
      a.href = canvas.toDataURL('image/png', 1.0);
      a.click();
    });

    render();
  </script>
</body>
</html>
